name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketplace/package-lock.json

      - name: Install dependencies
        working-directory: marketplace
        run: npm ci --legacy-peer-deps

      - name: Type-check
        working-directory: marketplace
        run: npx tsc --noEmit

      - name: Build
        working-directory: marketplace
        run: npm run build
        env:
          # Provide stub values so Next.js build succeeds without real secrets.
          # Actual deployment with real secrets is handled by Vercel directly.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://buymo.me' }}
